apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
        revision: main
        directories:
          - path: infrastructure/monitoring/*
  template:
    metadata:
      name: 'monitoring-{{.path.basename}}'
    spec:
      project: infra
      source:
        repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true