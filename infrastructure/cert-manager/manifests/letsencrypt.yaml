apiVersion: v1
kind: Pod
metadata:
  name: nginx-test
  labels:
    app: nginx-test
spec:
  containers:
    - name: nginx
      image: nginx:1.29-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi