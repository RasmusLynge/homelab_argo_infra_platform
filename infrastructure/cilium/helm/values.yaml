ipam:
  mode: kubernetes

# I only have one node
operator:
  replicas: 1

kubeProxyReplacement: true

k8sServiceHost: localhost
k8sServicePort: 7445

# Talos manages cgroups
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE


cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

gatewayAPI:
  enabled: true
l7Proxy: true


l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 20
  burst: 100

hubble:
  enabled: false
