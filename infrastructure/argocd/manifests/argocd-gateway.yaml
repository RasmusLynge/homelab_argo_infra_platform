apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.home.lynge.party"
      tls:
        certificateRefs:
          - name: home-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
spec:
  parentRefs:
    - name: home
  hostnames:
    - argocd.home.lynge.party
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-wildcard
  namespace: argocd
spec:
  secretName: home-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer 
  dnsNames:
    - "*.home.lynge.party"
    - "home.lynge.party"