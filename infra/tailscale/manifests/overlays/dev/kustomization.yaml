apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Connector, name: homelab-subnet-router }
    patch: |-
      - op: replace
        path: /spec/subnetRouter/advertiseRoutes
        value:
          - "192.168.0.240/29"
          - "192.168.0.36/32"
