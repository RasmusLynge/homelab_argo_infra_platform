apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: azure-store
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-oauth-client-id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-oauth-client-secret