apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target: { group: gateway.networking.k8s.io, kind: Gateway, name: home }
    patch: |-
      - op: replace
        path: /spec/addresses/0/value
        value: 192.168.0.240
      - op: replace
        path: /spec/listeners/0/hostname
        value: "*.home.lynge.party"

  - target: { group: cert-manager.io, kind: Certificate, name: home-wildcard }
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - "*.home.lynge.party"
          - "home.lynge.party"
      - op: replace
        path: /spec/issuerRef/name
        value: letsencrypt-prod
