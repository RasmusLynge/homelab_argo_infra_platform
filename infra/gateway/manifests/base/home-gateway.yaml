apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 10.10.10.10 # ip within cilium lbippool
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.yourdomain.com"
      tls:
        certificateRefs:
          - name: home-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-wildcard
spec:
  secretName: home-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.yourdomain.com"
    - "yourdomain.com"
