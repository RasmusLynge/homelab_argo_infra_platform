apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    component: gateway
    
spec:
  project: infra
  source:
    repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
    targetRevision: main
    path: infra/gateway/manifests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
