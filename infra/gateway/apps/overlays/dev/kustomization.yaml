apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # use the dev overlay of the crds
  - target: { kind: Application, name: gateway-crds }
    patch: |-
      - op: replace
        path: /spec/source/path
        value: infra/gateway/crds/overlays/dev
  # use the dev overlay of the manifests
  - target: { kind: Application, name: gateway-manifests }
    patch: |-
      - op: replace
        path: /spec/source/path
        value: infra/gateway/manifests/overlays/dev
