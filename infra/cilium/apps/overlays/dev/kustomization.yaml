apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # use the dev overlay of the manifests
  - target: { kind: Application, name: cilium-manifests }
    patch: |-
      - op: replace
        path: /spec/source/path
        value: infra/cilium/manifests/overlays/dev
