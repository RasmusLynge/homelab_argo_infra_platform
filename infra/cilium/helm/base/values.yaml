ipam:
  mode: kubernetes

operator:
  replicas: 1
  prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# Using KubePrism through Talos
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos manages cgroups
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

gatewayAPI:
  enabled: true
l7Proxy: true

l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 20
  burst: 100

hubble:
  enabled: true

  relay:
    enabled: true # gathers flows from all nodes; needed for the CLI and UI

  ui:
    enabled: true

  tls:
    auto:
      enabled: true
      method: cronJob

  metrics:
    enabled:
      # - dns
      - drop
      # - tcp
      # - flow
      # - icmp
      - "policy:sourceContext=app|workload-name|reserved-identity;destinationContext=app|workload-name|dns|reserved-identity;labelsContext=source_namespace,destination_namespace"
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack # must match your kube-prom-stack release name
    dashboards:
      enabled: true
      namespace: monitoring

  dropEventEmitter:
    enabled: true
    reasons:
      - policy_denied

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
