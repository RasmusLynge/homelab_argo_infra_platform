apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: CiliumL2AnnouncementPolicy, name: default }
    patch: |-
      - op: replace
        path: /spec/interfaces
        value:
          - ^eth[0-9]+
  #          - ^ens[0-9]+
  #          - ^vmbr[0-9]+
  - target: { kind: CiliumLoadBalancerIPPool, name: default-pool }
    patch: |-
      - op: replace
        path: /spec/blocks/0/start
        value: 192.168.0.240
      - op: replace
        path: /spec/blocks/0/stop
        value: 192.168.0.247
