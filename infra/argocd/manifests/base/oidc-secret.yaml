apiVersion: external-secrets.io/v1   # use v1beta1 on older ESO versions
kind: ExternalSecret
metadata:
  name: argocd-oidc
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-store
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd   # required, or Argo CD won't read it
      data:
        clientId: "{{ .clientId }}"
        clientSecret: "{{ .clientSecret }}"
        issuer: "https://login.microsoftonline.com/{{ .tenantId }}/v2.0"
  data:
    - secretKey: clientId
      remoteRef:
        key: argocd-client-id
    - secretKey: clientSecret
      remoteRef:
        key: argocd-client-secret
    - secretKey: tenantId
      remoteRef:
        key: tenant-id