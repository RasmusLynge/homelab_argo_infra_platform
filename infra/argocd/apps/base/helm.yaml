apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    component: argocd
spec:
  project: infra
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.4.0
    helm:
      releaseName: argocd
      valuesObject:
        dex:
          enabled: false

        configs:
          params:
            server.insecure: true # Using http-route with cert-manager
            controller.diff.server.side: true
          cm:
            url: https://yourhostname.com   # set per environment in overlays/
            # Lets parent apps wait for their child Applications (sync waves)
            resource.customizations.health.argoproj.io_Application: |
              hs = {}
              hs.status = "Progressing"
              hs.message = ""
              if obj.status ~= nil and obj.status.health ~= nil then
                hs.status = obj.status.health.status
                if obj.status.health.message ~= nil then
                  hs.message = obj.status.health.message
                end
              end
              return hs
            oidc.config: |
              name: Entra ID
              issuer: $argocd-oidc:issuer
              clientID: $argocd-oidc:clientId
              clientSecret: $argocd-oidc:clientSecret
              requestedIDTokenClaims:
                groups:
                  essential: true
                  value: "SecurityGroup"
              requestedScopes:
                - openid
                - profile
                - email
          rbac:
            policy.default: role:readonly
            scopes: '[roles, groups, email]'
            policy.csv: |
              g, Admin, role:admin
              g, Reader, role:readonly
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: baseline
        pod-security.kubernetes.io/warn: baseline
