apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # use the dev overlay of the manifests
  - target: { kind: Application, name: argocd-manifests }
    patch: |-
      - op: replace
        path: /spec/source/path
        value: infra/argocd/manifests/overlays/dev
  # Helm values that differ in dev
  - path: values.yaml
