apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
        revision: main
        files:
          - path: infra/*/helm/config.yaml
  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.syncWave}}'
        argocd.argoproj.io/compare-options: '{{ if dig "serverSideDiff" false . }}ServerSideDiff=true{{ end }}'
      labels:
        component: '{{.name}}'
    spec:
      project: infra
      sources:
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{.targetRevision}}'
          helm:
            releaseName: '{{.name}}'
            valueFiles:
              - $values/infra/{{.name}}/helm/values.yaml
        - repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated: 
          prune: true
          selfHeal: true
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: '{{ if dig "namespaceEnforcePrivileged" false . }}privileged{{ else }}baseline{{ end }}'
            pod-security.kubernetes.io/audit: baseline
            pod-security.kubernetes.io/warn: baseline