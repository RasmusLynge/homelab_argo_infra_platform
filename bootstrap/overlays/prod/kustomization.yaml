apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Application, name: root }
    patch: |-

      # Point to the prod overlay
      - op: replace
        path: /spec/source/path
        value: bootstrap/overlays/prod
        
      # using git main branch
      - op: replace
        path: /spec/source/targetRevision
        value: main

  - target: { kind: ApplicationSet, name: infra-manifests }
    patch: |-

      # Point to the prod overlay
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: infra/*/manifests/overlays/prod
        
      # using git main branch
      - op: replace
        path: /spec/generators/0/git/revision
        value: main
      - op: replace
        path: /spec/source/targetRevision
        value: main

  - target: { kind: ApplicationSet, name: infra-helm }
    patch: |-

      # Add prod values file
      - op: add
        path: /spec/template/spec/sources/0/helm/valueFiles/-
        value: $values/infra/{{.name}}/helm/values-prod.yaml
      # using git main branch
      - op: replace
        path: /spec/generators/0/git/revision
        value: main
      - op: replace
        path: /spec/source/targetRevision
        value: main

  - target: { kind: ApplicationSet, name: infra-crds }
    patch: |-

      # Point to the prod overlay
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: infra/*/crds/overlays/prod
      # using git main branch
      - op: replace
        path: /spec/generators/0/git/revision
        value: main
      - op: replace
        path: /spec/source/targetRevision
        value: main
