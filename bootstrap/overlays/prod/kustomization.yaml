apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Point the root app at the prod overlay
  - target: { kind: Application, name: root }
    patch: |-
      - op: replace
        path: /spec/source/path
        value: bootstrap/overlays/prod

  # One parent app per component that has an apps/overlays/prod folder
  - target: { kind: ApplicationSet, name: infra-components }
    patch: |-
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: infra/*/apps/overlays/prod
