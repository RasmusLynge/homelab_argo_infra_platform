apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: Application, name: root }
    patch: |-

      # Point to the prod overlay
      - op: replace
        path: /spec/source/path
        value: bootstrap/overlays/prod
      - op: replace
        path: /spec/source/targetRevision
        value: main

  - target: { kind: ApplicationSet, name: infra-components }
    patch: |-

      # One parent app per component that has an apps/overlays/prod folder
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: infra/*/apps/overlays/prod

      # using git main branch, for the parents and their git-based children
      - op: replace
        path: /spec/generators/0/git/revision
        value: main
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: main
      - op: replace
        path: /spec/template/spec/source/kustomize/patches/0/patch
        value: |-
          - op: replace
            path: /spec/source/targetRevision
            value: main
