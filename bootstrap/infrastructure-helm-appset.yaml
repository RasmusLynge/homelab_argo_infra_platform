apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
        revision: main
        files:
          - path: infrastructure/*/helm/config.yaml
  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.syncWave}}'
      labels:
        component: '{{.name}}'
    spec:
      project: infrastructure
      sources:
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{.targetRevision}}'
          helm:
            releaseName: '{{.name}}'
            valueFiles:
              - $values/infrastructure/{{.name}}/helm/values.yaml
        - repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated: 
          prune: true
          selfHeal: true
        syncOptions: [CreateNamespace=true, ServerSideApply=true]