apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
        revision: main
        directories:
          - path: infra/*/helm/base
  template:
    metadata:
      name: "{{index .path.segments 1}}"
      labels:
        component: "{{index .path.segments 1}}"
    spec:
      project: infra
      source:
        repoURL: git@github.com:RasmusLynge/homelab_argo_infra_platform.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 1}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions: [ServerSideApply=true]
