# The root app renders this chart with the cluster's values, so it manages itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      path: bootstrap
      helm:
        valueFiles:
          - $values/clusters/{{ required "cluster.name is required" .Values.cluster.name }}/values.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    {{- include "retry" . | nindent 4 }}
