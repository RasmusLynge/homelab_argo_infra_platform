apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 10.10.10.10 # ip within cilium lbippool
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.yourdomain.com"
      tls:
        certificateRefs:
          - name: home-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        # Only namespaces labelled gateway-access/home: "true" may attach routes.
        # Add-ons get the label with gateways: [home] in bootstrap/values.yaml.
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access/home: "true"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-wildcard
spec:
  secretName: home-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.yourdomain.com"
    - "yourdomain.com"
