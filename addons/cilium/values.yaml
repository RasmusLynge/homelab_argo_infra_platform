ipam:
  mode: kubernetes

operator:
  replicas: 1
  dashboards:
    enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack

# Using KubePrism through Talos
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos manages cgroups
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

gatewayAPI:
  enabled: true
l7Proxy: true

l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 20
  burst: 100

hubble:
  enabled: true

  relay:
    enabled: true # gathers flows from all nodes; needed for the CLI and UI

  ui:
    enabled: true

  tls:
    auto:
      enabled: true
      method: cronJob

  metrics:
    # what the four Hubble dashboards query, labelled by namespace
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - port-distribution:labelsContext=source_namespace,destination_namespace
      - icmp:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
      - "policy:sourceContext=app|workload-name|reserved-identity;destinationContext=app|workload-name|dns|reserved-identity;labelsContext=source_namespace,destination_namespace"
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack # must match your kube-prom-stack release name
    dashboards:
      enabled: true   # Grafana picks up dashboards from every namespace

  dropEventEmitter:
    enabled: true
    reasons:
      - policy_denied

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

# Grafana dashboards for the Cilium agent (operator and Hubble ones are set above)
dashboards:
  enabled: true

# Envoy handles the Gateway's traffic
envoy:
  prometheus:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
