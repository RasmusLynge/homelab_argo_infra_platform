apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # HTTPRoutes must use hostnames under the dev domain
  - target: { kind: ValidatingPolicy, name: httproute-https-and-hostname }
    patch: |-
      - op: replace
        path: /spec/variables/0/expression
        value: "'.home.lynge.party'"
