installCRDs: true

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

# ServiceMonitors for the controller, the webhook and the cert controller
serviceMonitor:
  enabled: true
